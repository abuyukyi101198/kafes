[package]
name = "kafes"
version = "0.1.0"
edition = "2024"

[dependencies]
colored = "3.1.1"
anyhow = "1.0.104"
inquire = "0.9.5"
which = "8.0.6"
indicatif = "0.18.6"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.2.1+spec-1.1.0"
serde_json = "1.0.154"
ureq = { version = "3.5.2", features = ["json"] }
clap = { version = "4", features = ["derive"] }
libc = "0.2.191"
ctrlc = { version = "3.5.3", features = ["termination"] }
